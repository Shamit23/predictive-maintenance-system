# Alembic config. The database URL is NOT stored here: migrations/env.py reads DATABASE_URL
# from the environment / .env (or an explicit url passed programmatically by tests).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
